<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>待办清单 · Supabase云同步</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #f7f4ef; min-height:100vh; display:flex; align-items:center; justify-content:center;
            padding:16px; color:#3e3a35;
        }
        .app-shell { width:100%; max-width:440px; }
        .auth-card, .app-container { background:#fffefb; border-radius:28px; box-shadow:0 8px 32px rgba(60,50,40,0.1); border:1px solid #e7e0d8; padding:28px 22px; }
        .auth-title { font-size:1.5rem; font-weight:620; text-align:center; margin-bottom:6px; }
        .auth-sub { text-align:center; color:#8c857b; font-size:0.85rem; margin-bottom:24px; }
        .input-field { width:100%; padding:12px 16px; margin-bottom:12px; border:1.5px solid #e7e0d8; border-radius:16px; font-size:0.95rem; background:#fdfcf9; outline:none; }
        .input-field:focus { border-color:#c27b5c; box-shadow:0 0 0 4px rgba(194,123,92,0.08); }
        .btn { width:100%; padding:13px; border:none; border-radius:16px; font-size:1rem; font-weight:600; background:#c27b5c; color:#fff; cursor:pointer; margin-top:6px; }
        .btn:active { transform:scale(0.97); }
        .btn:disabled { background:#ccc; }
        .auth-switch { text-align:center; margin-top:16px; font-size:0.85rem; color:#8c857b; }
        .auth-switch a { color:#c27b5c; text-decoration:none; cursor:pointer; }
        .error-msg { color:#d4786b; font-size:0.8rem; min-height:20px; margin-bottom:6px; line-height:1.4; }
        .success-msg { color:#5a8a6a; font-size:0.8rem; min-height:20px; margin-bottom:6px; }
        .main-app { display:none; }
        .main-app.active { display:block; }
        .auth-card.hidden { display:none; }
        .app-header { text-align:center; margin-bottom:8px; }
        .app-title { font-size:1.35rem; font-weight:620; }
        .dot { width:7px; height:7px; border-radius:50%; background:#c27b5c; display:inline-block; animation: dotPulse 2.6s infinite; }
        @keyframes dotPulse { 0%,100%{transform:scale(1);opacity:0.7} 50%{transform:scale(1.7);opacity:1} }
        .datetime-row { display:flex; align-items:center; justify-content:space-between; padding:10px 16px; background:linear-gradient(135deg,#fdfaf5,#f9f4eb); border-radius:18px; border:1px solid #efe8da; margin-bottom:14px; }
        .date-display { font-size:0.78rem; color:#8c857b; display:flex; align-items:center; gap:5px; }
        .time-display { font-size:1.3rem; font-weight:300; font-family:monospace; }
        .weekday-badge { font-size:0.68rem; color:#c27b5c; background:#fdf5f0; padding:1px 8px; border-radius:12px; }
        .user-avatar-wrapper { position:relative; margin-left:auto; }
        .user-avatar { width:44px; height:44px; border-radius:50%; background:#e8c9b8; border:2.5px solid #e8c9b8; cursor:pointer; display:flex; align-items:center; justify-content:center; font-weight:600; color:#fff; box-shadow:0 2px 10px rgba(60,50,40,0.1); }
        .avatar-dropdown { position:absolute; top:52px; right:0; background:#fff; border-radius:14px; box-shadow:0 6px 24px rgba(0,0,0,0.15); padding:6px 0; min-width:120px; opacity:0; visibility:hidden; pointer-events:none; transform:translateY(-8px); transition:0.25s; z-index:10; }
        .avatar-dropdown.show { opacity:1; visibility:visible; pointer-events:auto; transform:translateY(0); }
        .dropdown-username { padding:8px 16px; font-size:0.82rem; border-bottom:1px solid #f0ebe0; text-align:center; }
        .dropdown-logout { width:100%; padding:9px 16px; font-size:0.8rem; border:none; background:none; color:#c0392b; font-weight:600; cursor:pointer; }
        .dropdown-logout:hover { background:#fef0ef; }
        .input-wrapper { display:flex; gap:8px; margin-bottom:14px; }
        .todo-input { flex:1; padding:12px 15px; border:1.5px solid #e7e0d8; border-radius:16px; font-size:0.9rem; background:#fdfcf9; }
        .add-btn { width:42px; height:42px; border-radius:50%; background:#c27b5c; color:#fff; border:none; font-size:1.3rem; cursor:pointer; box-shadow:0 2px 8px rgba(194,123,92,0.25); }
        .todo-list { list-style:none; display:flex; flex-direction:column; gap:3px; min-height:40px; }
        .todo-item { display:flex; align-items:flex-start; gap:10px; padding:9px 12px; border-radius:12px; border:1px solid transparent; }
        .todo-item:hover { background:#fdfaf6; border-color:#f0e8dc; }
        .check-circle { width:20px; height:20px; border-radius:50%; border:2px solid #d5ccc0; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:1px; }
        .check-circle.completed { background:#c27b5c; border-color:#c27b5c; }
        .check-mark { font-size:0.6rem; color:#fff; opacity:0; }
        .check-circle.completed .check-mark { opacity:1; }
        .todo-content { flex:1; }
        .todo-text { font-size:0.9rem; word-break:break-word; }
        .completed-item .todo-text { color:#b5ada2; text-decoration:line-through; }
        .todo-date { font-size:0.65rem; color:#b5ada2; display:flex; align-items:center; gap:4px; }
        .date-dot { width:4px; height:4px; border-radius:50%; background:#d5ccc0; }
        .delete-btn { width:34px; height:34px; border-radius:50%; border:none; background:transparent; color:#c5bdb0; font-size:1rem; cursor:pointer; opacity:0.4; flex-shrink:0; transition:0.2s; }
        .todo-item:hover .delete-btn { opacity:1; }
        .delete-btn:hover { background:#fce8e4; color:#d4786b; box-shadow:0 3px 12px rgba(200,100,80,0.25); transform:scale(1.1); }
        .pagination { display:flex; gap:4px; justify-content:center; padding:8px 0; }
        .page-btn { min-width:28px; height:28px; border-radius:50%; border:1.5px solid transparent; background:transparent; color:#8c857b; cursor:pointer; font-size:0.78rem; }
        .page-btn.active { background:#c27b5c; color:#fff; border-color:#c27b5c; }
        .app-footer { display:flex; justify-content:space-between; padding-top:8px; margin-top:6px; border-top:1px solid #f0ebe0; font-size:0.78rem; color:#8c857b; }
        .hidden-pagination { display:none; }
        .particle { position:fixed; pointer-events:none; z-index:9999; border-radius:50%; animation:fly var(--duration) ease-out forwards; }
        @keyframes fly { 0%{transform:translate(0,0) scale(1);opacity:1} 100%{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0} }
        .debug-info { font-size:0.65rem; color:#999; margin-top:8px; text-align:center; word-break:break-all; }
    </style>
</head>
<body>
<div class="app-shell">
    <div class="auth-card" id="authCard">
        <div class="auth-title" id="authTitle">登录</div>
        <div class="auth-sub" id="authSub">同步待办，多设备共享</div>
        <input type="text" class="input-field" id="username" placeholder="用户名" autocomplete="off">
        <input type="password" class="input-field" id="password" placeholder="密码（至少6位）">
        <div class="error-msg" id="errorMsg"></div>
        <div class="success-msg" id="successMsg"></div>
        <button class="btn" id="authBtn">登 录</button>
        <div class="auth-switch">还没有账号？<a id="switchLink">立即注册</a></div>
        <div class="debug-info" id="debugInfo"></div>
    </div>

    <div class="main-app" id="mainApp">
        <div class="app-container">
            <header class="app-header"><h1 class="app-title">待办清单 <span class="dot"></span></h1></header>
            <div class="datetime-row">
                <div>
                    <div class="date-display"><span>📅</span> <span id="dateText"></span></div>
                    <div class="time-display"><span id="hours">00</span>:<span id="minutes">00</span></div>
                    <span class="weekday-badge" id="weekdayBadge"></span>
                </div>
                <div class="user-avatar-wrapper" id="avatarWrapper">
                    <div class="user-avatar" id="userAvatar">?</div>
                    <div class="avatar-dropdown" id="avatarDropdown">
                        <div class="dropdown-username" id="dropdownUsername"></div>
                        <button class="dropdown-logout" id="dropdownLogout">退出登录</button>
                    </div>
                </div>
            </div>
            <div class="input-wrapper">
                <input type="text" class="todo-input" placeholder="写点什么吧…" maxlength="200">
                <button class="add-btn">+</button>
            </div>
            <ul class="todo-list"></ul>
            <div class="pagination hidden-pagination">
                <button class="page-btn nav-btn prev-btn">‹</button>
                <span class="page-numbers" style="display:flex;gap:3px;"></span>
                <button class="page-btn nav-btn next-btn">›</button>
            </div>
            <footer class="app-footer">
                <span class="task-count">剩余 <strong>0</strong> 项</span>
            </footer>
        </div>
    </div>
</div>

<script>
    // ==================== 配置 Supabase ====================
    // ⚠️ 请替换为你的实际 Supabase 项目信息
    const SUPABASE_URL = 'https://ltuqtpgkmuqbbfcssvti.supabase.co/rest/v1/'; // 你的项目URL
    const SUPABASE_ANON_KEY = 'sb_publishable_xYRf0yvSgmN6pG1AJOyDFw_cOCGIcx5';              // 你的anon key

    // 显示调试信息（检查配置是否正确）
    const debugInfo = document.getElementById('debugInfo');
    if (SUPABASE_URL.includes('your-project') || SUPABASE_ANON_KEY.includes('your-anon')) {
        debugInfo.textContent = '⚠️ 请先替换代码中的 SUPABASE_URL 和 SUPABASE_ANON_KEY';
        debugInfo.style.color = '#e07b6e';
    } else {
        debugInfo.textContent = '✓ 配置已加载，准备连接 Supabase...';
        debugInfo.style.color = '#8c857b';
    }

    // 创建 Supabase 客户端
    let sb;
    try {
        sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: {
                autoRefreshToken: true,
                persistSession: true,
            }
        });
        debugInfo.textContent = '✓ Supabase 客户端创建成功';
    } catch(e) {
        debugInfo.textContent = '✗ 创建客户端失败: ' + e.message;
        debugInfo.style.color = '#d4786b';
    }

    // ==================== UI 元素引用 ====================
    const authCard = document.getElementById('authCard');
    const mainApp = document.getElementById('mainApp');
    const authTitle = document.getElementById('authTitle');
    const authSub = document.getElementById('authSub');
    const authBtn = document.getElementById('authBtn');
    const switchLink = document.getElementById('switchLink');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const errorMsg = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');
    const todoInput = document.querySelector('.todo-input');
    const addBtn = document.querySelector('.add-btn');
    const todoList = document.querySelector('.todo-list');
    const taskCount = document.querySelector('.task-count');
    const pagination = document.querySelector('.pagination');
    const pageNumbers = document.querySelector('.page-numbers');
    const prevBtn = document.querySelector('.prev-btn');
    const nextBtn = document.querySelector('.next-btn');
    const dateText = document.getElementById('dateText');
    const hoursEl = document.getElementById('hours');
    const minutesEl = document.getElementById('minutes');
    const weekdayBadge = document.getElementById('weekdayBadge');
    const userAvatar = document.getElementById('userAvatar');
    const avatarDropdown = document.getElementById('avatarDropdown');
    const dropdownUsername = document.getElementById('dropdownUsername');
    const dropdownLogout = document.getElementById('dropdownLogout');

    let isLoginMode = true;
    let currentUser = null;
    let todos = [];
    let currentPage = 1;
    const PAGE_SIZE = 7;
    let clockTimer = null;
    let channel = null;

    // ==================== 切换登录/注册 ====================
    switchLink.addEventListener('click', () => {
        isLoginMode = !isLoginMode;
        authTitle.textContent = isLoginMode ? '登录' : '注册';
        authSub.textContent = isLoginMode ? '同步待办，多设备共享' : '创建账号，开始使用';
        authBtn.textContent = isLoginMode ? '登 录' : '注 册';
        switchLink.textContent = isLoginMode ? '立即注册' : '已有账号？登录';
        errorMsg.textContent = '';
        successMsg.textContent = '';
    });

    // ==================== 时钟 ====================
    function updateClock() {
        const now = new Date();
        dateText.textContent = now.getFullYear() + '年' + (now.getMonth()+1) + '月' + now.getDate() + '日';
        hoursEl.textContent = String(now.getHours()).padStart(2,'0');
        minutesEl.textContent = String(now.getMinutes()).padStart(2,'0');
        weekdayBadge.textContent = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][now.getDay()];
    }
    function startClock() { updateClock(); clockTimer = setInterval(updateClock, 1000); }
    function stopClock() { if(clockTimer) clearInterval(clockTimer); }

    // ==================== 粒子特效 ====================
    function spawnParticles(el, type='complete') {
        const rect = el.getBoundingClientRect();
        const x = rect.left + rect.width/2, y = rect.top + rect.height/2;
        const colors = type==='complete' ? ['#e8b86d','#f0c78e','#c27b5c','#ffe0b2'] : ['#e07b6e','#d4786b'];
        for(let i=0; i<10; i++) {
            const p = document.createElement('div'); p.className='particle';
            const angle = Math.random()*Math.PI*2, dist = 20+Math.random()*40;
            p.style.cssText = `left:${x}px;top:${y}px;width:4px;height:4px;background:${colors[Math.floor(Math.random()*colors.length)]};--dx:${Math.cos(angle)*dist}px;--dy:${Math.sin(angle)*dist}px;--duration:${400+Math.random()*300}ms;`;
            document.body.appendChild(p);
            p.addEventListener('animationend', ()=>p.remove());
        }
    }

    // ==================== 头像与下拉菜单 ====================
    document.getElementById('avatarWrapper').addEventListener('click', (e) => {
        e.stopPropagation();
        avatarDropdown.classList.toggle('show');
    });
    document.addEventListener('click', () => avatarDropdown.classList.remove('show'));

    dropdownLogout.addEventListener('click', async (e) => {
        e.stopPropagation();
        await sb.auth.signOut();
        stopClock();
        mainApp.classList.remove('active');
        authCard.classList.remove('hidden');
        currentUser = null;
        todos = [];
        if(channel) { sb.removeChannel(channel); channel = null; }
        todoList.innerHTML = '';
        avatarDropdown.classList.remove('show');
    });

    // ==================== 登录/注册处理 ====================
    authBtn.addEventListener('click', async () => {
        const username = usernameInput.value.trim();
        const password = passwordInput.value.trim();
        errorMsg.textContent = '';
        successMsg.textContent = '';

        if(!username || !password) {
            errorMsg.textContent = '用户名和密码不能为空';
            return;
        }
        if(username.length < 2) {
            errorMsg.textContent = '用户名至少2个字符';
            return;
        }
        if(password.length < 6) {
            errorMsg.textContent = '密码至少6个字符';
            return;
        }

        // 测试网络连接
        debugInfo.textContent = '正在连接 Supabase...';
        debugInfo.style.color = '#8c857b';
        authBtn.disabled = true;
        authBtn.textContent = '连接中...';

        const email = `${username}@todo.local`;
        
        try {
            if(isLoginMode) {
                const { data, error } = await sb.auth.signInWithPassword({ email, password });
                if(error) {
                    if(error.message.includes('Invalid login credentials')) {
                        throw new Error('用户名或密码错误');
                    }
                    throw error;
                }
                successMsg.textContent = '登录成功！';
            } else {
                const { data, error } = await sb.auth.signUp({ 
                    email, 
                    password,
                    options: { data: { username: username } }
                });
                if(error) throw error;
                successMsg.textContent = '注册成功！正在登录...';
                // 注册后自动登录
                const { error: loginError } = await sb.auth.signInWithPassword({ email, password });
                if(loginError) throw loginError;
            }

            const { data: { user }, error: userError } = await sb.auth.getUser();
            if(userError) throw userError;
            
            debugInfo.textContent = '✓ 已连接 Supabase，用户ID: ' + user.id.slice(0, 8) + '...';
            debugInfo.style.color = '#5a8a6a';
            
            if(user) showMainApp(user);

        } catch(e) {
            console.error('认证错误:', e);
            errorMsg.textContent = e.message || '认证失败';
            debugInfo.textContent = '✗ 连接失败: ' + (e.message || '未知错误');
            debugInfo.style.color = '#d4786b';
        } finally {
            authBtn.disabled = false;
            authBtn.textContent = isLoginMode ? '登 录' : '注 册';
        }
    });

    // ==================== 进入主应用 ====================
    function showMainApp(user) {
        currentUser = user;
        authCard.classList.add('hidden');
        mainApp.classList.add('active');
        dropdownUsername.textContent = user.email.split('@')[0];
        const initial = user.email.charAt(0).toUpperCase();
        userAvatar.textContent = initial;
        userAvatar.style.background = getColorFromUsername(user.email);
        startClock();
        initTodoApp();
    }

    function getColorFromUsername(str) {
        let hash = 0;
        for(let i=0; i<str.length; i++) hash = str.charCodeAt(i) + ((hash<<5)-hash);
        return `hsl(${hash%360}, 40%, 55%)`;
    }

    // ==================== 待办核心 ====================
    async function loadTodos() {
        if(!currentUser) return;
        const { data, error } = await sb
            .from('todos')
            .select('*')
            .eq('user_id', currentUser.id)
            .order('created_at', { ascending: false });
        if(!error) {
            todos = data || [];
            renderPage();
        }
    }

    async function addTodo(text) {
        if(!currentUser) return;
        const { error } = await sb.from('todos').insert([{ user_id: currentUser.id, text }]);
        if(error) console.error('添加失败:', error);
    }

    async function toggleTodo(id, completed) {
        const { error } = await sb.from('todos').update({ completed: !completed }).eq('id', id);
        if(error) console.error('更新失败:', error);
    }

    async function deleteTodo(id) {
        const { error } = await sb.from('todos').delete().eq('id', id);
        if(error) console.error('删除失败:', error);
    }

    function renderPage() {
        const totalPages = Math.ceil(todos.length / PAGE_SIZE);
        if(currentPage > totalPages) currentPage = totalPages;
        const start = (currentPage-1)*PAGE_SIZE;
        const pageData = todos.slice(start, start+PAGE_SIZE);

        todoList.innerHTML = '';
        pageData.forEach(t => {
            const li = document.createElement('li');
            li.className = 'todo-item' + (t.completed ? ' completed-item' : '');
            li.innerHTML = `
                <div class="check-circle${t.completed?' completed':''}" data-id="${t.id}">
                    <span class="check-mark">✓</span>
                </div>
                <div class="todo-content">
                    <span class="todo-text">${escapeHtml(t.text)}</span>
                    <span class="todo-date"><span class="date-dot"></span>${formatDate(t.created_at)}</span>
                </div>
                <button class="delete-btn" data-id="${t.id}">×</button>
            `;
            li.querySelector('.check-circle').onclick = (e) => {
                e.stopPropagation();
                spawnParticles(e.currentTarget, 'complete');
                toggleTodo(t.id, t.completed);
            };
            li.querySelector('.delete-btn').onclick = (e) => {
                e.stopPropagation();
                spawnParticles(e.currentTarget, 'delete');
                deleteTodo(t.id);
            };
            todoList.appendChild(li);
        });

        pageNumbers.innerHTML = '';
        if(totalPages <= 1) {
            pagination.classList.add('hidden-pagination');
        } else {
            pagination.classList.remove('hidden-pagination');
            for(let i=1; i<=totalPages; i++) {
                const btn = document.createElement('button');
                btn.className = 'page-btn' + (i===currentPage?' active':'');
                btn.textContent = i;
                btn.onclick = () => { currentPage=i; renderPage(); };
                pageNumbers.appendChild(btn);
            }
        }
        prevBtn.disabled = currentPage <= 1;
        nextBtn.disabled = currentPage >= totalPages;

        const remaining = todos.filter(t=>!t.completed).length;
        taskCount.innerHTML = `剩余 <strong>${remaining}</strong> 项 · 共 ${todos.length} 条`;
    }

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    function formatDate(isoString) {
        const d = new Date(isoString);
        return (d.getMonth()+1) + '.' + d.getDate().toString().padStart(2,'0');
    }

    function subscribeRealtime() {
        if(!currentUser) return;
        channel = sb
            .channel('todos-changes')
            .on('postgres_changes',
                { event: '*', schema: 'public', table: 'todos', filter: `user_id=eq.${currentUser.id}` },
                () => loadTodos()
            )
            .subscribe();
    }

    function initTodoApp() {
        addBtn.onclick = () => {
            const text = todoInput.value.trim();
            if(text) { addTodo(text); todoInput.value = ''; }
        };
        todoInput.onkeydown = (e) => { if(e.key==='Enter') addBtn.click(); };
        prevBtn.onclick = () => { if(currentPage>1) { currentPage--; renderPage(); } };
        nextBtn.onclick = () => {
            const total = Math.ceil(todos.length/PAGE_SIZE);
            if(currentPage<total) { currentPage++; renderPage(); }
        };
        loadTodos();
        subscribeRealtime();
    }

    // 页面加载时检查会话
    (async function checkSession() {
        const { data: { user } } = await sb.auth.getUser();
        if(user) showMainApp(user);
    })();

    window.addEventListener('beforeunload', () => {
        stopClock();
        if(channel) sb.removeChannel(channel);
    });
</script>
</body>
</html>
