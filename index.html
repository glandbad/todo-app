<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>待办清单 · 云同步</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✅</text></svg>">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #f7f4ef; min-height:100vh; display:flex; align-items:center; justify-content:center;
            padding:16px; color:#3e3a35;
        }
        .app-shell { width:100%; max-width:440px; }
        .auth-card, .app-container {
            background:#fffefb; border-radius:28px; box-shadow:0 8px 32px rgba(60,50,40,0.1);
            border:1px solid #e7e0d8; padding:28px 22px;
        }
        .auth-title { font-size:1.5rem; font-weight:620; text-align:center; margin-bottom:6px; }
        .auth-sub { text-align:center; color:#8c857b; font-size:0.85rem; margin-bottom:24px; }
        .input-field {
            width:100%; padding:12px 16px; margin-bottom:12px; border:1.5px solid #e7e0d8;
            border-radius:16px; font-size:0.95rem; background:#fdfcf9; outline:none;
        }
        .input-field:focus { border-color:#c27b5c; box-shadow:0 0 0 4px rgba(194,123,92,0.08); }
        .btn {
            width:100%; padding:13px; border:none; border-radius:16px; font-size:1rem;
            font-weight:600; background:#c27b5c; color:#fff; cursor:pointer; margin-top:6px;
        }
        .btn:active { transform:scale(0.97); }
        .auth-switch { text-align:center; margin-top:16px; font-size:0.85rem; color:#8c857b; }
        .auth-switch a { color:#c27b5c; text-decoration:none; cursor:pointer; }
        .error-msg { color:#d4786b; font-size:0.8rem; min-height:20px; margin-bottom:6px; white-space:pre-line; }
        .main-app { display:none; }
        .main-app.active { display:block; }
        .auth-card.hidden { display:none; }
        .app-header { text-align:center; margin-bottom:8px; }
        .app-title { font-size:1.35rem; font-weight:620; }
        .dot {
            width:7px; height:7px; border-radius:50%; background:#c27b5c;
            display:inline-block; animation:dotPulse 2.6s infinite;
        }
        @keyframes dotPulse { 0%,100%{transform:scale(1);opacity:0.7} 50%{transform:scale(1.7);opacity:1} }
        .datetime-row {
            display:flex; align-items:center; justify-content:space-between;
            padding:10px 16px; background:linear-gradient(135deg,#fdfaf5,#f9f4eb);
            border-radius:18px; border:1px solid #efe8da; margin-bottom:14px;
        }
        .date-display { font-size:0.78rem; color:#8c857b; display:flex; align-items:center; gap:5px; }
        .time-display { font-size:1.3rem; font-weight:300; font-family:monospace; }
        .weekday-badge {
            font-size:0.68rem; color:#c27b5c; background:#fdf5f0; padding:1px 8px; border-radius:12px;
        }
        .user-avatar-wrapper { position:relative; margin-left:auto; }
        .user-avatar {
            width:44px; height:44px; border-radius:50%; background:#e8c9b8;
            border:2.5px solid #e8c9b8; cursor:pointer; display:flex; align-items:center;
            justify-content:center; font-weight:600; color:#fff; box-shadow:0 2px 10px rgba(60,50,40,0.1);
        }
        .avatar-dropdown {
            position:absolute; top:52px; right:0; background:#fff; border-radius:14px;
            box-shadow:0 6px 24px rgba(0,0,0,0.15); padding:6px 0; min-width:120px;
            opacity:0; visibility:hidden; pointer-events:none; transform:translateY(-8px);
            transition:0.25s; z-index:10;
        }
        .avatar-dropdown.show { opacity:1; visibility:visible; pointer-events:auto; transform:translateY(0); }
        .dropdown-username { padding:8px 16px; font-size:0.82rem; border-bottom:1px solid #f0ebe0; text-align:center; }
        .dropdown-logout {
            width:100%; padding:9px 16px; font-size:0.8rem; border:none; background:none;
            color:#c0392b; font-weight:600; cursor:pointer;
        }
        .dropdown-logout:hover { background:#fef0ef; }
        .input-wrapper { display:flex; gap:8px; margin-bottom:14px; }
        .todo-input {
            flex:1; padding:12px 15px; border:1.5px solid #e7e0d8; border-radius:16px;
            font-size:0.9rem; background:#fdfcf9;
        }
        .add-btn {
            width:42px; height:42px; border-radius:50%; background:#c27b5c; color:#fff;
            border:none; font-size:1.3rem; cursor:pointer; box-shadow:0 2px 8px rgba(194,123,92,0.25);
        }
        .todo-list { list-style:none; display:flex; flex-direction:column; gap:3px; min-height:40px; }
        .todo-item {
            display:flex; align-items:flex-start; gap:10px; padding:9px 12px;
            border-radius:12px; border:1px solid transparent;
        }
        .todo-item:hover { background:#fdfaf6; border-color:#f0e8dc; }
        .check-circle {
            width:20px; height:20px; border-radius:50%; border:2px solid #d5ccc0;
            cursor:pointer; display:flex; align-items:center; justify-content:center;
            flex-shrink:0; margin-top:1px;
        }
        .check-circle.completed { background:#c27b5c; border-color:#c27b5c; }
        .check-mark { font-size:0.6rem; color:#fff; opacity:0; }
        .check-circle.completed .check-mark { opacity:1; }
        .todo-content { flex:1; }
        .todo-text { font-size:0.9rem; word-break:break-word; }
        .completed-item .todo-text { color:#b5ada2; text-decoration:line-through; }
        .todo-date { font-size:0.65rem; color:#b5ada2; display:flex; align-items:center; gap:4px; }
        .date-dot { width:4px; height:4px; border-radius:50%; background:#d5ccc0; }
        .delete-btn {
            width:34px; height:34px; border-radius:50%; border:none; background:transparent;
            color:#c5bdb0; font-size:1rem; cursor:pointer; opacity:0.4; flex-shrink:0;
            transition:0.2s;
        }
        .todo-item:hover .delete-btn { opacity:1; }
        .delete-btn:hover {
            background:#fce8e4; color:#d4786b; box-shadow:0 3px 12px rgba(200,100,80,0.25);
            transform:scale(1.1);
        }
        .pagination { display:flex; gap:4px; justify-content:center; padding:8px 0; }
        .page-btn {
            min-width:28px; height:28px; border-radius:50%; border:1.5px solid transparent;
            background:transparent; color:#8c857b; cursor:pointer; font-size:0.78rem;
        }
        .page-btn.active { background:#c27b5c; color:#fff; border-color:#c27b5c; }
        .app-footer {
            display:flex; justify-content:space-between; padding-top:8px; margin-top:6px;
            border-top:1px solid #f0ebe0; font-size:0.78rem; color:#8c857b;
        }
        .hidden-pagination { display:none; }
        .particle {
            position:fixed; pointer-events:none; z-index:9999; border-radius:50%;
            animation:fly var(--duration) ease-out forwards;
        }
        @keyframes fly {
            0%{transform:translate(0,0) scale(1);opacity:1}
            100%{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}
        }
        .warning-banner {
            background:#fff3cd; border:1px solid #ffc107; border-radius:12px;
            padding:10px 14px; margin-bottom:14px; font-size:0.75rem; color:#856404;
            display:none; text-align:center;
        }
        .warning-banner.show { display:block; }
    </style>
</head>
<body>
<div class="app-shell">
    <!-- 隐私模式警告 -->
    <div class="warning-banner" id="warningBanner">
        ⚠️ 检测到浏览器隐私限制，部分功能可能受限。<br>
        请关闭跟踪防护或将本网站加入例外。
    </div>

    <div class="auth-card" id="authCard">
        <div class="auth-title" id="authTitle">登录</div>
        <div class="auth-sub" id="authSub">同步待办，多设备共享</div>
        <input type="text" class="input-field" id="username" placeholder="用户名" autocomplete="off">
        <input type="password" class="input-field" id="password" placeholder="密码（至少6个字符）">
        <div class="error-msg" id="errorMsg"></div>
        <button class="btn" id="authBtn">登 录</button>
        <div class="auth-switch">还没有账号？<a id="switchLink">立即注册</a></div>
    </div>

    <div class="main-app" id="mainApp">
        <div class="app-container">
            <header class="app-header"><h1 class="app-title">待办清单 <span class="dot"></span></h1></header>
            <div class="datetime-row">
                <div>
                    <div class="date-display"><span>📅</span> <span id="dateText"></span></div>
                    <div class="time-display"><span id="hours">00</span>:<span id="minutes">00</span></div>
                    <span class="weekday-badge" id="weekdayBadge"></span>
                </div>
                <div class="user-avatar-wrapper" id="avatarWrapper">
                    <div class="user-avatar" id="userAvatar">?</div>
                    <div class="avatar-dropdown" id="avatarDropdown">
                        <div class="dropdown-username" id="dropdownUsername"></div>
                        <button class="dropdown-logout" id="dropdownLogout">退出登录</button>
                    </div>
                </div>
            </div>
            <div class="input-wrapper">
                <input type="text" class="todo-input" placeholder="写点什么吧…" maxlength="200">
                <button class="add-btn">+</button>
            </div>
            <ul class="todo-list"></ul>
            <div class="pagination hidden-pagination">
                <button class="page-btn nav-btn prev-btn">‹</button>
                <span class="page-numbers" style="display:flex;gap:3px;"></span>
                <button class="page-btn nav-btn next-btn">›</button>
            </div>
            <footer class="app-footer">
                <span class="task-count">剩余 <strong>0</strong> 项</span>
            </footer>
        </div>
    </div>
</div>

<script>
(function() {
    // ==================== 配置 Supabase ====================
    // ❗❗ 必须修改为你自己的 Supabase 信息 ❗❗
    var SUPABASE_URL = 'https://ltuqtpgkmuqbbfcssvti.supabase.co/rest/v1/';  // 你的项目URL
    var SUPABASE_ANON_KEY = 'sb_publishable_xYRf0yvSgmN6pG1AJOyDFw_cOCGIcx5
';               // 你的匿名密钥

    // ==================== 存储可用性检测 ====================
    var storageAvailable = false;
    try {
        var testKey = '__storage_test__';
        localStorage.setItem(testKey, '1');
        localStorage.removeItem(testKey);
        storageAvailable = true;
    } catch(e) {
        storageAvailable = false;
        document.getElementById('warningBanner').classList.add('show');
    }

    // 自定义存储（内存降级方案）
    var memoryStore = {};
    var customStorage = {
        getItem: function(key) {
            if (storageAvailable) {
                try { return localStorage.getItem(key); } catch(e) { return memoryStore[key] || null; }
            }
            return memoryStore[key] || null;
        },
        setItem: function(key, value) {
            if (storageAvailable) {
                try { localStorage.setItem(key, value); } catch(e) { memoryStore[key] = value; }
            } else {
                memoryStore[key] = value;
            }
        },
        removeItem: function(key) {
            if (storageAvailable) {
                try { localStorage.removeItem(key); } catch(e) { delete memoryStore[key]; }
            } else {
                delete memoryStore[key];
            }
        }
    };

    // 初始化 Supabase 客户端
    var supabaseClient;
    try {
        supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: {
                autoRefreshToken: true,
                persistSession: true,
                storage: customStorage
            }
        });
    } catch(e) {
        document.getElementById('errorMsg').textContent = '初始化失败，请检查配置';
    }

    // 快速配置检查
    if (SUPABASE_URL.indexOf('your-project') >= 0 || SUPABASE_ANON_KEY.indexOf('your-anon') >= 0) {
        document.getElementById('errorMsg').textContent = '请先替换代码开头的 SUPABASE_URL 和 SUPABASE_ANON_KEY';
    }

    // ==================== UI 元素 ====================
    var authCard = document.getElementById('authCard');
    var mainApp = document.getElementById('mainApp');
    var authTitle = document.getElementById('authTitle');
    var authSub = document.getElementById('authSub');
    var authBtn = document.getElementById('authBtn');
    var switchLink = document.getElementById('switchLink');
    var usernameInput = document.getElementById('username');
    var passwordInput = document.getElementById('password');
    var errorMsg = document.getElementById('errorMsg');
    var todoInput = document.querySelector('.todo-input');
    var addBtn = document.querySelector('.add-btn');
    var todoList = document.querySelector('.todo-list');
    var taskCount = document.querySelector('.task-count');
    var pagination = document.querySelector('.pagination');
    var pageNumbers = document.querySelector('.page-numbers');
    var prevBtn = document.querySelector('.prev-btn');
    var nextBtn = document.querySelector('.next-btn');
    var dateText = document.getElementById('dateText');
    var hoursEl = document.getElementById('hours');
    var minutesEl = document.getElementById('minutes');
    var weekdayBadge = document.getElementById('weekdayBadge');
    var userAvatar = document.getElementById('userAvatar');
    var avatarDropdown = document.getElementById('avatarDropdown');
    var dropdownUsername = document.getElementById('dropdownUsername');
    var dropdownLogout = document.getElementById('dropdownLogout');

    var isLoginMode = true;
    var currentUser = null;
    var todos = [];
    var currentPage = 1;
    var PAGE_SIZE = 7;
    var clockTimer = null;
    var channel = null;

    // ==================== 切换登录/注册 ====================
    switchLink.addEventListener('click', function() {
        isLoginMode = !isLoginMode;
        authTitle.textContent = isLoginMode ? '登录' : '注册';
        authSub.textContent = isLoginMode ? '同步待办，多设备共享' : '创建账号，开始使用';
        authBtn.textContent = isLoginMode ? '登 录' : '注 册';
        switchLink.textContent = isLoginMode ? '立即注册' : '已有账号？登录';
        errorMsg.textContent = '';
    });

    // ==================== 时钟 ====================
    function updateClock() {
        var now = new Date();
        dateText.textContent = now.getFullYear() + '年' + (now.getMonth()+1) + '月' + now.getDate() + '日';
        hoursEl.textContent = String(now.getHours()).padStart(2,'0');
        minutesEl.textContent = String(now.getMinutes()).padStart(2,'0');
        var weekdays = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
        weekdayBadge.textContent = weekdays[now.getDay()];
    }
    function startClock() { updateClock(); clockTimer = setInterval(updateClock, 1000); }
    function stopClock() { if(clockTimer) clearInterval(clockTimer); }

    // ==================== 粒子特效 ====================
    function spawnParticles(el, type) {
        type = type || 'complete';
        var rect = el.getBoundingClientRect();
        var x = rect.left + rect.width/2;
        var y = rect.top + rect.height/2;
        var colors = type === 'complete' ? ['#e8b86d','#f0c78e','#c27b5c','#ffe0b2'] : ['#e07b6e','#d4786b'];
        for(var i = 0; i < 10; i++) {
            var p = document.createElement('div');
            p.className = 'particle';
            var angle = Math.random() * Math.PI * 2;
            var dist = 20 + Math.random() * 40;
            var color = colors[Math.floor(Math.random() * colors.length)];
            var dx = Math.cos(angle) * dist;
            var dy = Math.sin(angle) * dist;
            var duration = 400 + Math.random() * 300;
            p.style.cssText = 'left:' + x + 'px;top:' + y + 'px;width:4px;height:4px;' +
                'background:' + color + ';' +
                '--dx:' + dx + 'px;--dy:' + dy + 'px;--duration:' + duration + 'ms;' +
                'animation-duration:' + duration + 'ms;';
            document.body.appendChild(p);
            p.addEventListener('animationend', function() { p.remove(); });
        }
    }

    // ==================== 头像与菜单 ====================
    document.getElementById('avatarWrapper').addEventListener('click', function(e) {
        e.stopPropagation();
        avatarDropdown.classList.toggle('show');
    });
    document.addEventListener('click', function() { avatarDropdown.classList.remove('show'); });

    dropdownLogout.addEventListener('click', async function(e) {
        e.stopPropagation();
        await supabaseClient.auth.signOut();
        stopClock();
        mainApp.classList.remove('active');
        authCard.classList.remove('hidden');
        currentUser = null;
        todos = [];
        if(channel) { supabaseClient.removeChannel(channel); channel = null; }
        todoList.innerHTML = '';
        avatarDropdown.classList.remove('show');
    });

    // ==================== 登录/注册处理 ====================
    authBtn.addEventListener('click', async function() {
        var username = usernameInput.value.trim();
        var password = passwordInput.value.trim();
        errorMsg.textContent = '';

        if(!username || !password) {
            errorMsg.textContent = '用户名和密码不能为空';
            return;
        }
        if(password.length < 6) {
            errorMsg.textContent = '密码至少6个字符';
            return;
        }

        var email = username + '@todo.local';

        try {
            var result;
            if(isLoginMode) {
                result = await supabaseClient.auth.signInWithPassword({ email: email, password: password });
            } else {
                result = await supabaseClient.auth.signUp({ email: email, password: password });
            }

            if(result.error) {
                var msg = result.error.message;
                if(msg.indexOf('Invalid login') >= 0) {
                    errorMsg.textContent = '登录失败：用户名或密码错误';
                } else if(msg.indexOf('already registered') >= 0) {
                    errorMsg.textContent = '该用户名已存在，请直接登录';
                } else if(msg.indexOf('rate limit') >= 0) {
                    errorMsg.textContent = '操作太频繁，请稍后再试';
                } else if(msg.indexOf('fetch') >= 0 || msg.indexOf('network') >= 0) {
                    errorMsg.textContent = '网络错误：请检查 Supabase URL 是否正确';
                } else {
                    errorMsg.textContent = '错误：' + msg;
                }
                return;
            }

            var userResult = await supabaseClient.auth.getUser();
            if(userResult.error) {
                errorMsg.textContent = '获取用户信息失败：' + userResult.error.message;
                return;
            }
            if(userResult.data && userResult.data.user) {
                showMainApp(userResult.data.user);
            }

        } catch(e) {
            console.error('Auth error:', e);
            errorMsg.textContent = '网络错误：请检查配置和网络连接';
        }
    });

    // ==================== 进入主应用 ====================
    function showMainApp(user) {
        currentUser = user;
        authCard.classList.add('hidden');
        mainApp.classList.add('active');
        var userName = user.email.split('@')[0];
        dropdownUsername.textContent = userName;
        userAvatar.textContent = userName.charAt(0).toUpperCase();
        userAvatar.style.background = getColorFromUsername(user.email);
        startClock();
        bindTodoEvents();
        loadTodos();
        subscribeRealtime();
    }

    function getColorFromUsername(str) {
        var hash = 0;
        for(var i = 0; i < str.length; i++) {
            hash = str.charCodeAt(i) + ((hash << 5) - hash);
        }
        return 'hsl(' + (hash % 360) + ', 40%, 55%)';
    }

    // ==================== 待办数据操作 ====================
    async function loadTodos() {
        if(!currentUser || !supabaseClient) return;
        var result = await supabaseClient
            .from('todos')
            .select('*')
            .eq('user_id', currentUser.id)
            .order('created_at', { ascending: false });

        if(result.error) {
            console.error('加载待办失败:', result.error);
            if(result.error.message.indexOf('does not exist') >= 0) {
                alert('数据库表 "todos" 不存在，请先在 Supabase SQL Editor 中创建表');
            }
            return;
        }
        todos = result.data || [];
        renderPage();
    }

    async function addTodo(text) {
        if(!currentUser || !supabaseClient) return;
        var result = await supabaseClient
            .from('todos')
            .insert([{ user_id: currentUser.id, text: text, completed: false }]);

        if(result.error) {
            console.error('添加待办失败:', result.error);
            if(result.error.message.indexOf('row-level security') >= 0) {
                alert('权限不足：请检查 Supabase RLS 策略是否正确配置');
            } else {
                alert('添加失败：' + result.error.message);
            }
            return;
        }
        await loadTodos();
    }

    async function toggleTodo(id, completed) {
        if(!supabaseClient) return;
        var result = await supabaseClient
            .from('todos')
            .update({ completed: !completed })
            .eq('id', id);
        if(result.error) console.error('切换状态失败:', result.error);
        await loadTodos();
    }

    async function deleteTodo(id) {
        if(!supabaseClient) return;
        var result = await supabaseClient
            .from('todos')
            .delete()
            .eq('id', id);
        if(result.error) console.error('删除失败:', result.error);
        await loadTodos();
    }

    function renderPage() {
        var totalPages = Math.ceil(todos.length / PAGE_SIZE);
        if(currentPage > totalPages) currentPage = totalPages;
        if(currentPage < 1) currentPage = 1;
        var start = (currentPage - 1) * PAGE_SIZE;
        var pageData = todos.slice(start, start + PAGE_SIZE);

        todoList.innerHTML = '';
        for(var i = 0; i < pageData.length; i++) {
            var t = pageData[i];
            var li = document.createElement('li');
            li.className = 'todo-item' + (t.completed ? ' completed-item' : '');
            var dateStr = formatDate(t.created_at);
            var completedClass = t.completed ? ' completed' : '';
            li.innerHTML = '<div class="check-circle' + completedClass + '" data-id="' + t.id + '">' +
                '<span class="check-mark">✓</span></div>' +
                '<div class="todo-content">' +
                '<span class="todo-text">' + escapeHtml(t.text) + '</span>' +
                '<span class="todo-date"><span class="date-dot"></span>' + dateStr + '</span>' +
                '</div>' +
                '<button class="delete-btn" data-id="' + t.id + '">×</button>';

            (function(todo) {
                li.querySelector('.check-circle').onclick = function(e) {
                    e.stopPropagation();
                    spawnParticles(this, 'complete');
                    toggleTodo(todo.id, todo.completed);
                };
                li.querySelector('.delete-btn').onclick = function(e) {
                    e.stopPropagation();
                    spawnParticles(this, 'delete');
                    deleteTodo(todo.id);
                };
            })(t);

            todoList.appendChild(li);
        }

        pageNumbers.innerHTML = '';
        if(totalPages <= 1) {
            pagination.classList.add('hidden-pagination');
        } else {
            pagination.classList.remove('hidden-pagination');
            for(var j = 1; j <= totalPages; j++) {
                var btn = document.createElement('button');
                btn.className = 'page-btn' + (j === currentPage ? ' active' : '');
                btn.textContent = j;
                (function(pageNum) {
                    btn.onclick = function() { currentPage = pageNum; renderPage(); };
                })(j);
                pageNumbers.appendChild(btn);
            }
        }
        prevBtn.disabled = currentPage <= 1;
        nextBtn.disabled = currentPage >= totalPages;

        var remaining = todos.filter(function(t) { return !t.completed; }).length;
        taskCount.innerHTML = '剩余 <strong>' + remaining + '</strong> 项 · 共 ' + todos.length + ' 条';
    }

    function escapeHtml(str) {
        var div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    function formatDate(isoString) {
        if(!isoString) return '';
        var d = new Date(isoString);
        return (d.getMonth()+1) + '.' + String(d.getDate()).padStart(2,'0');
    }

    function subscribeRealtime() {
        if(!currentUser || !supabaseClient) return;
        if(channel) supabaseClient.removeChannel(channel);
        channel = supabaseClient
            .channel('todos-' + currentUser.id)
            .on('postgres_changes',
                { event: '*', schema: 'public', table: 'todos', filter: 'user_id=eq.' + currentUser.id },
                function() { loadTodos(); }
            )
            .subscribe();
    }

    function bindTodoEvents() {
        addBtn.onclick = function() {
            var text = todoInput.value.trim();
            if(text) { addTodo(text); todoInput.value = ''; }
        };
        todoInput.onkeydown = function(e) { if(e.key === 'Enter') addBtn.click(); };
        prevBtn.onclick = function() { if(currentPage > 1) { currentPage--; renderPage(); } };
        nextBtn.onclick = function() {
            var total = Math.ceil(todos.length / PAGE_SIZE);
            if(currentPage < total) { currentPage++; renderPage(); }
        };
    }

    window.addEventListener('beforeunload', function() {
        stopClock();
        if(channel && supabaseClient) supabaseClient.removeChannel(channel);
    });

    // 自动恢复会话
    (async function checkSession() {
        if(!supabaseClient) return;
        try {
            var result = await supabaseClient.auth.getUser();
            if(result.data && result.data.user) showMainApp(result.data.user);
        } catch(e) {
            console.log('未登录或会话已过期');
        }
    })();
})();
</script>
</body>
</html>
