        .add-btn { width:42px; height:42px; border-radius:50%; background:#c27b5c; color:#fff; border:none; font-size:1.3rem; cursor:pointer; }
        .todo-list { list-style:none; display:flex; flex-direction:column; gap:3px; min-height:40px; }
        .todo-item { display:flex; align-items:flex-start; gap:10px; padding:9px 10px 9px 12px; border-radius:12px; background:transparent; border:1px solid transparent; transition:0.25s; }
        .todo-item:hover { background:#fdfaf6; border-color:#f0e8dc; }

<body>
    <div class="app-shell">
        <div class="auth-card" id="authCard">
            <div class="auth-title" id="authTitle">登录</div>
            <div class="auth-sub" id="authSub">欢迎回来，继续管理你的待办</div>
            <input type="email" class="input-field" id="email" placeholder="邮箱" autocomplete="email">
            <input type="password" class="input-field" id="password" placeholder="密码">
            <div class="error-msg" id="errorMsg"></div>
            <button class="btn" id="authBtn">登 录</button>
            <div class="auth-switch">
                还没有账号？<a href="#" id="switchLink">立即注册</a>
            </div>
        </div>

        <div class="main-app" id="mainApp">
            <div class="app-container">
                <header class="app-header">
                    <h1 class="app-title">待办清单 <span class="dot"></span></h1>
                </header>
                <div class="datetime-row">
                    <div class="datetime-info">
                        <div class="date-display"><span id="dateText">加载中…</span></div>
                        <div class="time-display"><span id="hours">00</span>:<span id="minutes">00</span></div>
                        <span class="weekday-badge" id="weekdayBadge">今天</span>
                    </div>
                    <div class="user-avatar-wrapper" id="userAvatarWrapper">
                        <div class="user-avatar" id="userAvatar">?</div>
                        <div class="avatar-dropdown" id="avatarDropdown">
                            <div class="dropdown-username" id="dropdownUsername">用户</div>
                            <button class="dropdown-logout" id="dropdownLogout">退出登录</button>
                        </div>
                    </div>
                    <input type="file" id="avatarFileInput" accept="image/*" style="display:none">
                </div>
                <div class="input-wrapper">
                    <input type="text" class="todo-input" placeholder="写点什么吧…" maxlength="200">
                    <button class="add-btn">+</button>
                </div>
                <ul class="todo-list"></ul>
                <div class="pagination hidden-pagination">
                    <button class="page-btn nav-btn prev-btn">‹</button>
                    <span class="page-numbers" style="display:flex;gap:3px;"></span>
                    <button class="page-btn nav-btn next-btn">›</button>
                </div>
                <footer class="app-footer">
                    <span class="task-count">剩余 <strong>0</strong> 项 · 共 0 条</span>
                </footer>
            </div>
        </div>
    </div>

    <script>
        // ==================== 你的 Supabase 配置（替换这里） ====================
        const SUPABASE_URL = 'https://xxxxxxxxxxxx.supabase.co';
        const SUPABASE_KEY = 'eyJxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx';
        // ====================================================================

        const { createClient } = supabase;
        const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        // 全局状态
        let currentUser = null;
        let todos = [];
        let currentPage = 1;
        const PAGE_SIZE = 7;
        let clockInterval = null;

        // ==================== 界面元素 ====================
        const authCard = document.getElementById('authCard');
        const mainApp = document.getElementById('mainApp');
        const authBtn = document.getElementById('authBtn');
        const switchLink = document.getElementById('switchLink');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const errorMsg = document.getElementById('errorMsg');
        const authTitle = document.getElementById('authTitle');
        const authSub = document.getElementById('authSub');

        const todoList = document.querySelector('.todo-list');
        const todoInput = document.querySelector('.todo-input');
        const addBtn = document.querySelector('.add-btn');
        const prevBtn = document.querySelector('.prev-btn');
        const nextBtn = document.querySelector('.next-btn');
        const pageNumbers = document.querySelector('.page-numbers');
        const pagination = document.querySelector('.pagination');
        const taskCount = document.querySelector('.task-count');
        const dateText = document.getElementById('dateText');
        const hoursEl = document.getElementById('hours');
        const minutesEl = document.getElementById('minutes');
        const weekdayBadge = document.getElementById('weekdayBadge');

        const userAvatar = document.getElementById('userAvatar');
        const dropdownUsername = document.getElementById('dropdownUsername');
        const avatarDropdown = document.getElementById('avatarDropdown');
        const avatarFileInput = document.getElementById('avatarFileInput');
        const dropdownLogout = document.getElementById('dropdownLogout');

        let isLoginMode = true;

        // ==================== 认证逻辑 ====================
        switchLink.addEventListener('click', (e) => {
            e.preventDefault();
            isLoginMode = !isLoginMode;
            if (isLoginMode) {
                authTitle.textContent = '登录';
                authSub.textContent = '欢迎回来，继续管理你的待办';
                authBtn.textContent = '登 录';
                switchLink.textContent = '立即注册';
            } else {
                authTitle.textContent = '注册';
                authSub.textContent = '创建一个新账号开始使用';
                authBtn.textContent = '注 册';
                switchLink.textContent = '已有账号？登录';
            }
            errorMsg.textContent = '';
        });

        authBtn.addEventListener('click', async () => {
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            if (!email || !password) {
                errorMsg.textContent = '邮箱和密码不能为空';
                return;
            }
            if (password.length < 6) {
                errorMsg.textContent = '密码至少6个字符';
                return;
            }

            if (isLoginMode) {
                const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) {
                    errorMsg.textContent = error.message;
                } else {
                    currentUser = data.user;
                    afterLogin();
                }
            } else {
                const { data, error } = await supabase.auth.signUp({ email, password });
                if (error) {
                    errorMsg.textContent = error.message;
                } else {
                    errorMsg.textContent = '注册成功！已自动登录。';
                    currentUser = data.user;
                    // 为新用户创建 profile 记录
                    await supabase.from('profiles').insert({ id: currentUser.id });
                    afterLogin();
                }
            }
        });

        dropdownLogout.addEventListener('click', async () => {
            await supabase.auth.signOut();
            hideMainApp();
        });

        // ==================== 界面切换 ====================
        function hideMainApp() {
            mainApp.classList.remove('active');
            authCard.classList.remove('hidden');
            if (clockInterval) clearInterval(clockInterval);
            currentUser = null;
        }

        async function afterLogin() {
            authCard.classList.add('hidden');
            mainApp.classList.add('active');
            // 更新头像显示
            await loadProfile();
            // 加载待办
            await loadTodos();
            // 启动时钟
            updateClock();
            clockInterval = setInterval(updateClock, 1000);
            todoInput.focus();
        }

        // ==================== 用户头像相关 ====================
        async function loadProfile() {
            dropdownUsername.textContent = currentUser.email;
            // 从 profiles 表获取头像 URL
            const { data, error } = await supabase
                .from('profiles')
                .select('avatar_url')
                .eq('id', currentUser.id)
                .single();
            if (!error && data && data.avatar_url) {
                userAvatar.style.backgroundImage = `url(${data.avatar_url})`;
                userAvatar.style.backgroundSize = 'cover';
                userAvatar.style.backgroundPosition = 'center';
                userAvatar.style.backgroundColor = 'transparent';
                userAvatar.textContent = '';
            } else {
                // 默认头像：用邮箱首字母大写
                userAvatar.style.backgroundImage = '';
                userAvatar.style.backgroundColor = getColorFromEmail(currentUser.email);
                userAvatar.textContent = currentUser.email.charAt(0).toUpperCase();
            }
        }

        function getColorFromEmail(email) {
            let hash = 0;
            for (let i = 0; i < email.length; i++) {
                hash = email.charCodeAt(i) + ((hash << 5) - hash);
                hash = hash & hash;
            }
            const hue = Math.abs(hash % 360);
            return `hsl(${hue}, 45%, 55%)`;
        }

        // 头像上传
        userAvatar.addEventListener('click', (e) => {
            e.stopPropagation();
            avatarFileInput.click();
        });
        avatarFileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            if (!file.type.startsWith('image/')) {
                alert('请选择图片文件');
                return;
            }
            // 压缩图片
            const base64 = await compressImage(file, 200, 200);
            // 上传到 Supabase Storage
            const filePath = `${currentUser.id}/avatar_${Date.now()}.jpg`;
            const { error: uploadError } = await supabase.storage
                .from('avatars')
                .upload(filePath, dataURLtoBlob(base64), {
                    contentType: 'image/jpeg',
                    upsert: true
                });
            if (uploadError) {
                alert('上传失败：' + uploadError.message);
                return;
            }
            // 获取公开 URL
            const { data: urlData } = supabase.storage
                .from('avatars')
                .getPublicUrl(filePath);
            const avatarUrl = urlData.publicUrl;
            // 更新 profiles 表
            await supabase.from('profiles').upsert({ id: currentUser.id, avatar_url: avatarUrl });
            // 更新界面
            userAvatar.style.backgroundImage = `url(${avatarUrl})`;
            userAvatar.style.backgroundSize = 'cover';
            userAvatar.style.backgroundPosition = 'center';
            userAvatar.style.backgroundColor = 'transparent';
            userAvatar.textContent = '';
            avatarFileInput.value = '';
        });

        function compressImage(file, maxW, maxH) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let w = img.width, h = img.height;
                        if (w > maxW) { h *= maxW / w; w = maxW; }
                        if (h > maxH) { w *= maxH / h; h = maxH; }
                        canvas.width = w;
                        canvas.height = h;
                        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                        resolve(canvas.toDataURL('image/jpeg', 0.7));
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        function dataURLtoBlob(dataurl) {
            const arr = dataurl.split(','), mime = arr[0].match(/:(.*?);/)[1],
                bstr = atob(arr[1]), n = bstr.length, u8arr = new Uint8Array(n);
            while (n--) u8arr[n] = bstr.charCodeAt(n);
            return new Blob([u8arr], { type: mime });
        }

        // 头像下拉菜单
        document.getElementById('userAvatarWrapper').addEventListener('click', (e) => {
            e.stopPropagation();
            avatarDropdown.classList.toggle('show');
        });
        document.addEventListener('click', (e) => {
            if (!document.getElementById('userAvatarWrapper').contains(e.target))
                avatarDropdown.classList.remove('show');
        });

        // ==================== 待办数据操作 ====================
        async function loadTodos() {
            const { data, error } = await supabase
                .from('todos')
                .select('*')
                .eq('user_id', currentUser.id)
                .order('created_at', { ascending: false });
            if (error) {
                console.error('加载待办失败：', error);
                todos = [];
            } else {
                todos = data.map(t => ({
                    id: t.id,
                    text: t.text,
                    completed: t.completed,
                    createdAt: t.created_at
                }));
            }
            renderPage();
        }

        async function addTodo() {
            const text = todoInput.value.trim();
            if (!text) return;
            const { error } = await supabase.from('todos').insert({
                user_id: currentUser.id,
                text: text,
                completed: false
            });
            if (error) {
                alert('添加失败：' + error.message);
                return;
            }
            todoInput.value = '';
            await loadTodos();
            currentPage = 1;
            renderPage();
        }

        async function toggleTodo(todo) {
            const { error } = await supabase
                .from('todos')
                .update({ completed: !todo.completed })
                .eq('id', todo.id);
            if (error) {
                alert('更新失败：' + error.message);
                return;
            }
            // 粒子特效在渲染前触发
            if (!todo.completed) {
                const el = document.querySelector(`[data-id="${todo.id}"] .check-circle`);
                if (el) spawnParticles(el, 'complete');
            }
            await loadTodos();
        }

        async function deleteTodo(todoId) {
            const el = document.querySelector(`[data-id="${todoId}"] .delete-btn`);
            if (el) spawnParticles(el, 'delete');
            await supabase.from('todos').delete().eq('id', todoId);
            await loadTodos();
        }

        // ==================== 分页 & 渲染 ====================
        function renderPage() {
            const totalPages = Math.max(1, Math.ceil(todos.length / PAGE_SIZE));
            if (currentPage > totalPages) currentPage = totalPages;
            const start = (currentPage - 1) * PAGE_SIZE;
            const pageData = todos.slice(start, start + PAGE_SIZE);

            todoList.innerHTML = '';
            pageData.forEach(t => {
                const li = document.createElement('li');
                li.className = 'todo-item' + (t.completed ? ' completed-item' : '');
                li.setAttribute('data-id', t.id);
                li.innerHTML = `
                    <button class="check-circle${t.completed ? ' completed' : ''}">
                        <span class="check-mark">✓</span>
                    </button>
                    <div class="todo-content">
                        <span class="todo-text">${escapeHtml(t.text)}</span>
                        <span class="todo-date">${formatDate(t.createdAt)}</span>
                    </div>
                    <button class="delete-btn">×</button>
                `;
                li.querySelector('.check-circle').addEventListener('click', () => toggleTodo(t));
                li.querySelector('.delete-btn').addEventListener('click', () => deleteTodo(t.id));
                todoList.appendChild(li);
            });

            // 分页按钮
            pageNumbers.innerHTML = '';
            if (totalPages <= 1) {
                pagination.classList.add('hidden-pagination');
            } else {
                pagination.classList.remove('hidden-pagination');
                for (let i = 1; i <= totalPages; i++) {
                    const btn = document.createElement('button');
                    btn.className = 'page-btn' + (i === currentPage ? ' active' : '');
                    btn.textContent = i;
                    btn.onclick = () => { currentPage = i; renderPage(); };
                    pageNumbers.appendChild(btn);
                }
            }
            prevBtn.disabled = currentPage <= 1;
            nextBtn.disabled = currentPage >= totalPages;

            const remaining = todos.filter(t => !t.completed).length;
            taskCount.innerHTML = `剩余 <strong>${remaining}</strong> 项 · 共 ${todos.length} 条`;
        }

        function formatDate(iso) {
            const d = new Date(iso);
            return (d.getMonth()+1) + '.' + d.getDate().toString().padStart(2,'0');
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ==================== 粒子特效（保留原样） ====================
        function spawnParticles(el, type) {
            const rect = el.getBoundingClientRect();
            const cx = rect.left + rect.width/2;
            const cy = rect.top + rect.height/2;
            const colors = type === 'complete' ?
                ['#e8b86d','#f0c78e','#d4a55a','#f5d5a8','#c27b5c'] :
                ['#e07b6e','#f0a098','#d4786b'];
            for (let i=0; i<10; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                const angle = Math.random()*Math.PI*2;
                const dist = 20+Math.random()*40;
                p.style.cssText = `
                    left:${cx}px; top:${cy}px;
                    width:${3+Math.random()*4}px; height:${3+Math.random()*4}px;
                    background:${colors[Math.floor(Math.random()*colors.length)]};
                    --dx:${Math.cos(angle)*dist}px;
                    --dy:${Math.sin(angle)*dist}px;
                    --duration:${400+Math.random()*300}ms;
                    animation-duration:${400+Math.random()*300}ms;
                `;
                p.addEventListener('animationend', () => p.remove());
                document.body.appendChild(p);
            }
        }

        // ==================== 时钟 ====================
        function updateClock() {
            const now = new Date();
            dateText.textContent = now.getFullYear()+'年'+(now.getMonth()+1)+'月'+now.getDate()+'日';
            hoursEl.textContent = now.getHours().toString().padStart(2,'0');
            minutesEl.textContent = now.getMinutes().toString().padStart(2,'0');
            const w = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
            weekdayBadge.textContent = w[now.getDay()];
        }

        // ==================== 事件绑定 ====================
        addBtn.addEventListener('click', addTodo);
        todoInput.addEventListener('keydown', e => { if (e.key==='Enter') addTodo(); });
        prevBtn.addEventListener('click', () => { if(currentPage>1){ currentPage--; renderPage(); } });
        nextBtn.addEventListener('click', () => { if(currentPage<Math.ceil(todos.length/PAGE_SIZE)){ currentPage++; renderPage(); } });

        // 自动恢复会话
        (async () => {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                currentUser = session.user;
                afterLogin();
            }
        })();
    </script>
</body>
</html>
